[project]
name = "dispatchsim"
version = "0.1.0"
description = "A production-style delivery dispatch simulator with an ML ETA model and eval-gated CI"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "pyarrow"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
