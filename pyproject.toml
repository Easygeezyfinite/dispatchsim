[project]
name = "dispatchsim"
version = "0.1.0"
description = "A food delivery dispatch simulator with a FastAPI dispatch service and an eval-gated CI"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "pyarrow", "fastapi>=0.115", "uvicorn>=0.32"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
